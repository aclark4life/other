[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "other"
version = "2.1.0"
description = "The Zen of Zope, by Jeffrey 'Alex' Clark"
authors = [{ name = "Jeffrey 'Alex' Clark", email = "aclark@aclark.net" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "zope.component",
    "zope.interface",
]
keywords = ["zope", "zope.interface", "zope.component", "zen"]
classifiers = [
    "Framework :: Zope",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["readme"]

[project.urls]
Homepage = "https://github.com/aclark4life/other"
Source = "https://github.com/aclark4life/other"
Issues = "https://github.com/aclark4life/other/issues"
Changelog = "https://github.com/aclark4life/other/blob/main/CHANGELOG.md"
Funding = "https://github.com/sponsors/aclark4life"

[dependency-groups]
test = ["pytest"]
dev = [{ include-group = "test" }, "prek"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.dynamic]
readme = { file = ["README.md", "CHANGELOG.md"], content-type = "text/markdown" }
