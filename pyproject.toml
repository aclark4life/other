[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "other"  # The other: get it?!
version = "2.0.1"
description = "The Zen of Zope, by Alex Clark"
authors = [{ name = "Alex Clark", email = "aclark@aclark.net" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    # This: included in the stdlib
    "that",  # That: included for fun
    "zope.component",
    "zope.interface",
]
keywords = ["zope", "zope.interface", "zope.component", "zen"]
classifiers = [
    "Framework :: Zope",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["readme"]

[project.urls]
Homepage = "https://github.com/aclark4life/other"
Source = "https://github.com/aclark4life/other"
Issues = "https://github.com/aclark4life/other/issues"
Changelog = "https://github.com/aclark4life/other/blob/main/CHANGES.txt"
Funding = "https://github.com/sponsors/aclark4life"

[dependency-groups]
dev = ["prek"]

[tool.setuptools]
py-modules = ["other"]

[tool.setuptools.dynamic]
readme = { file = ["README.rst", "CHANGES.txt"], content-type = "text/x-rst" }
